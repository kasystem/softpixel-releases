name: Release PROGRAMERI Android APK
# Phase 9 — builds the Capacitor Android release APK from pos-ui and signs it
# with apksigner (pos-ui/android/app/build.gradle has no gradle signingConfig
# block — release APKs are built unsigned by `gradlew assembleRelease` and
# must be signed out-of-band, mirroring how this is done outside CI today).
# Drafts (never publishes) a GitHub Release with the signed APK attached.
#
# Manual dispatch only. Guarded: fails fast, before any build work happens,
# if the keystore secrets are not configured. Nothing in this workflow has
# ever been executed — see PHASE_9_ELECTRON_RELEASE_REPORT.md. The signing
# step in particular is unverified against a real keystore in this
# environment and should be dry-run once before first real use.
on:
  workflow_dispatch:
    inputs:
      pos_ui_ref:
        description: Exact kasystem/pos-ui ref/SHA to build
        required: true
      channel:
        type: choice
        options: [internal, beta, stable]
        default: internal
      draft_release:
        description: Create a draft GitHub Release with the signed APK attached (always drafted, never auto-published)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  guard-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Require Android keystore secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::$name is not configured; APK cannot be signed. No build attempted."; exit 1; }
          done
          echo "Secrets present. Requested pos-ui ref: ${{ inputs.pos_ui_ref }}, channel: ${{ inputs.channel }}"

  build:
    needs: guard-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pos-ui
        uses: actions/checkout@v4
        with:
          repository: kasystem/pos-ui
          ref: ${{ inputs.pos_ui_ref }}
          path: pos-ui

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools (build-tools for apksigner/zipalign)
        uses: android-actions/setup-android@v3

      - name: Install deps, build web assets, sync Capacitor, assemble unsigned release APK
        working-directory: pos-ui
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Locate unsigned APK
        id: unsigned
        working-directory: pos-ui/android
        run: echo "path=$(find . -name '*-release-unsigned.apk' -o -name 'app-release-unsigned.apk' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Align and sign APK with apksigner
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          build_tools="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n1)"
          "$build_tools/zipalign" -p -f 4 "pos-ui/android/${{ steps.unsigned.outputs.path }}" /tmp/app-aligned.apk
          "$build_tools/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out /tmp/app-release-signed.apk \
            /tmp/app-aligned.apk
          rm -f /tmp/release.keystore

      - name: Compute version + SHA-256
        id: artifact
        run: |
          echo "sha256=$(sha256sum /tmp/app-release-signed.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "apk_version=$(node -p "require('./pos-ui/package.json').version")-${{ inputs.channel }}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: programeri-android-${{ steps.artifact.outputs.apk_version }}
          path: /tmp/app-release-signed.apk
          retention-days: 14

      - name: Draft GitHub Release
        if: ${{ inputs.draft_release }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ inputs.channel != 'stable' }}
          tag_name: android-${{ inputs.channel }}-${{ steps.artifact.outputs.apk_version }}
          files: /tmp/app-release-signed.apk
