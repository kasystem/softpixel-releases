name: Draft PROGRAMERI Electron UI release
on:
  workflow_dispatch:
    inputs:
      ui_ref:
        description: Exact pos-ui ref
        required: true
      channel:
        type: choice
        options: [internal, beta, stable]
        default: internal
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "UI draft requested for ${{ inputs.ui_ref }} on ${{ inputs.channel }}; publishing remains disabled pending approved signing configuration."
      - env:
          MANIFEST_SIGNING_KEY: ${{ secrets.PROGRAMERI_MANIFEST_SIGNING_KEY }}
          UI_BUNDLE_KEY: ${{ secrets.PROGRAMERI_UI_BUNDLE_KEY }}
        run: test -n "$MANIFEST_SIGNING_KEY" || { echo "Manifest signing key missing; no bundle created."; exit 1; }
